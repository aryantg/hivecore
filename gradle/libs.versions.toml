[versions]
agp = "8.13.2"
kotlin = "2.4.20"
# Plan 5 says composeBom 2026.09.00 / lifecycle 2.11.0 / core 1.19.1, but those require AGP 9.1 + compileSdk 37
# (AAR metadata) and the plan locks AGP 8.13.2 / compileSdk 36. These are the newest versions that build with AGP 8.x.
composeBom = "2026.06.01"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
core = "1.18.0"
appcompat = "1.7.1"
coroutines = "1.11.0"
serialization = "1.11.0"
geniex = "0.8.0"
litert = "1.4.2"
qnnDelegate = "2.50.0"
ortQnn = "1.29.0"
nearby = "19.5.0"
mlkitText = "16.0.1"
biometric = "1.1.0"
pdfbox = "2.0.27.0"
camerax = "1.6.2"
junit = "4.13.2"
sqliteJdbc = "3.53.4.0"
okhttp = "4.12.0"
streamWebrtc = "1.3.8"
securityCrypto = "1.1.0"
firebaseMessaging = "26.0.0"

[libraries]
# Compose (artifact versions come from the BOM)
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
# Core
androidx-core = { group = "androidx.core", name = "core", version.ref = "core" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
# Coroutines / JSON
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
# LLM runtime (Qualcomm GenieX)
geniex-android = { group = "com.qualcomm.qti", name = "geniex-android", version.ref = "geniex" }
litert = { group = "com.google.ai.edge.litert", name = "litert", version.ref = "litert" }
qnn-litert-delegate = { group = "com.qualcomm.qti", name = "qnn-litert-delegate", version.ref = "qnnDelegate" }
onnxruntime-android-qnn = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android-qnn", version.ref = "ortQnn" }
# Mesh
play-services-nearby = { group = "com.google.android.gms", name = "play-services-nearby", version.ref = "nearby" }
# OCR
mlkit-text-recognition = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkitText" }
# Biometric
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
# PDF
pdfbox-android = { group = "com.tom-roush", name = "pdfbox-android", version.ref = "pdfbox" }
# Camera
camerax-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camerax-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camerax-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
# Tests
junit = { group = "junit", name = "junit", version.ref = "junit" }
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqliteJdbc" }
# v2
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
stream-webrtc = { group = "io.getstream", name = "stream-webrtc-android", version.ref = "streamWebrtc" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging", version.ref = "firebaseMessaging" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# ---- v2 plan (remote mesh, cloud, key store, push) ----
# versions
# okhttp 4.12.0: WebSocket (RelayTransport) and HTTP (OpenRouter CloudClient); mockwebserver for the JVM tests
# stream-webrtc-android 1.3.8: maintained prebuilt WebRTC (plan §3.3)
# security-crypto 1.1.0: EncryptedSharedPreferences for the OpenRouter key (plan §8.4)
# firebase-messaging 26.0.0 (BoM 35.0.0, 2026-10-07): WAKE data messages (plan §3.4)
android-library = { id = "com.android.library", version.ref = "agp" }
